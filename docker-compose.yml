services:
  # ── Banco de Dados ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: juris_postgres
    environment:
      POSTGRES_DB: juris_intelligence
      POSTGRES_USER: juris_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - juris_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juris_admin -d juris_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Broker Celery) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: juris_redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API FastAPI ──────────────────────────────────
  api:
    build: .
    container_name: juris_api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8002}:8000"
    environment:
      DATABASE_URL: postgresql://juris_admin:${DB_PASSWORD:-postgres}@postgres:5432/juris_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-troque-em-producao}
      DEBUG: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker Celery (Processamento de IA) ──────────
  worker:
    build: .
    container_name: juris_worker
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo --concurrency=1
    environment:
      DATABASE_URL: postgresql://juris_admin:${DB_PASSWORD:-postgres}@postgres:5432/juris_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  juris_pg_data:
